name: Compile TikZ to SVG and Update Sheet

on:
  workflow_dispatch: # Cho phép thầy bấm nút chạy thủ công (Manual Trigger) trên GitHub
  push:
    branches:
      - main  # Hoặc master tùy theo nhánh chính của thầy
# Thêm khối phân quyền này vào file YAML
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn kho lưu trữ
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # 3. Cài đặt các công cụ LaTeX và dvisvgm lên máy chủ GitHub
      - name: Install LaTeX and pdf2svg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-pictures texlive-science texlive-fonts-extra pdf2svg
      
      # 4. Cài đặt các thư viện Python cần thiết
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests

      # 5. Chạy script Python biên dịch TikZ và cập nhật Google Sheet
      - name: Run TikZ Compiler Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_KEY: "1Yqo9L3cgyliMA4sS_X2-U8kU1fkc1GYfJux8TT1vmy0"
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: python3 scripts/build_tikz.py

      # 6. Commit và Push các file SVG mới sinh ra (có cơ chế an toàn chống lỗi 128)
      - name: Commit and Push generated SVG files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Kiểm tra xem có thư mục images và file SVG hay không
          if [ -d "images" ] && ls images/*.svg 1> /dev/null 2>&1; then
            git add images/*.svg
            
            # Kiểm tra xem có thay đổi thực sự nào được staged hay không trước khi commit
            if git diff --staged --quiet; then
              echo "ℹ️ Các file SVG không có thay đổi mới nào so với kho lưu trữ. Bỏ qua bước commit."
            else
              git commit -m "Auto-compile TikZ figures to SVG [skip ci]"
              git push
              echo "✅ Đã đẩy các file SVG mới lên GitHub thành công!"
            fi
          else
            echo "⚠️ Không tìm thấy file SVG nào."
          fi

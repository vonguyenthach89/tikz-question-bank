name: Compile TikZ to SVG

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công hoặc qua API từ Google Apps Script

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install LaTeX & dvisvgm
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm python3-pip

    #  - name: Install Python Dependencies
 #       run: |
   #       pip install gspread oauth2client
          
      - name: Install dependencies
        run: |
          pip install gspread oauth2client
          python -m pip install --upgrade pip
          pip install gspread google-auth requests markdown
          # Thêm các thư viện khác mà script của thầy đang dùng nếu có
        
      - name: Run TikZ Compiler Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 scripts/build_tikz.py

      - name: Commit and Push generated SVG files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Kiểm tra xem có file SVG nào được sinh ra hay không trước khi add
          if [ -d "images" ] && ls images/*.svg 1> /dev/null 2>&1; then
            git add images/*.svg
            git commit -m "Auto-compile TikZ figures to SVG [skip ci]"
            git push
          else
            echo "⚠️ Không tìm thấy file SVG mới nào để commit. Bỏ qua bước đẩy code."
          fi
